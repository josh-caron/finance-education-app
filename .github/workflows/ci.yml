name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # Catches a schema change committed without its migration.
      - name: Migrations are up to date
        run: |
          pnpm db:generate
          git diff --exit-code packages/db/drizzle \
            || (echo "::error::Schema changed without a generated migration. Run pnpm db:generate and commit the result." && exit 1)
